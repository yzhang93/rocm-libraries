GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 128

BenchmarkProblems:
  # --------------------------------------------------------------------------
  # PartialRMS, no residual add.
  # Groups are split by MT1 (wg1) because the native Tensile pipeline requires
  # all solutions in one BenchmarkProblemSizeGroup to share the same MT1.
  # MT1 = mfma_n * macs_n * wg1 = 16 * 8 * wg1.
  # --------------------------------------------------------------------------
  -
    - # ProblemType — bf16 TN GEMM with PartialRMS epilogue (no residual add)
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0
      UsePartialRMS: True
      PartialRMSResidualAdd: False

    - # BenchmarkProblemSizeGroup — MT1=128 (wg1=1), no residual add
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 1, 1]   # MT0=128  MT1=128  wg0=1 wg1=1
            - [16, 16, 32, 1, 1, 4, 8, 2, 1]   # MT0=256  MT1=128  wg0=2 wg1=1
            - [16, 16, 32, 1, 1, 4, 8, 4, 1]   # MT0=512  MT1=128  wg0=4 wg1=1
        - PartialRMSResidualAdd: [False]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - PartialRMS: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
        - PrefetchAcrossPersistent: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [4096, 4096, 1, 4096]
            - Exact: [8192, 4096, 1, 4096]

    - # BenchmarkProblemSizeGroup — MT1=256 (wg1=2), no residual add
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 1, 2]   # MT0=128  MT1=256  wg0=1 wg1=2
            - [16, 16, 32, 1, 1, 4, 8, 4, 2]   # MT0=512  MT1=256  wg0=4 wg1=2
        - PartialRMSResidualAdd: [False]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - PartialRMS: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
        - PrefetchAcrossPersistent: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [4096, 4096, 1, 4096]
            - Exact: [8192, 4096, 1, 4096]

  # --------------------------------------------------------------------------
  # PartialRMS + residual add.
  # wg0 <= 2 is required for residual add kernels.
  # --------------------------------------------------------------------------
  -
    - # ProblemType — bf16 TN GEMM with PartialRMS epilogue (residual add)
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0
      UsePartialRMS: True
      PartialRMSResidualAdd: True

    - # BenchmarkProblemSizeGroup — MT1=128 (wg1=1), residual add (wg0<=2)
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 1, 1]   # MT0=128  MT1=128  wg0=1 wg1=1
            - [16, 16, 32, 1, 1, 4, 8, 2, 1]   # MT0=256  MT1=128  wg0=2 wg1=1
        - PartialRMSResidualAdd: [True]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - PartialRMS: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
        - PrefetchAcrossPersistent: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [4096, 4096, 1, 4096]
            - Exact: [8192, 4096, 1, 4096]

    - # BenchmarkProblemSizeGroup — MT1=256 (wg1=2), residual add (wg0<=2)
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 1, 2]   # MT0=128  MT1=256  wg0=1 wg1=2
        - PartialRMSResidualAdd: [True]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - PartialRMS: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
        - PrefetchAcrossPersistent: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [4096, 4096, 1, 4096]
            - Exact: [8192, 4096, 1, 4096]

# TestAxes is read by testAxesFromYaml() in yaml_solution_builder and is not
# consumed by TensileCreateLibrary.
#
# K1 axes: free0=NHidden, free1=M (M_tokens). K is the contraction dim.
#   MMultipliers: MT1 multiples to include (expanded against the solution's MT1).
#   MFixed:       fixed M values independent of tile size.
#   NHidden:      independent pytest param axis.
#   K:            independent pytest param axis.
# Pipeline axes (K1→row_div, no residual): NHidden must be a multiple of 128
#   (row_div block width). M and K same convention as K1.
TestAxes:
  K1:
    MMultipliers: [1, 2, 4, 8, 16, 32]
    MFractions:   [[1, 4], [1, 2]]
    MOffsets:     [[-1, -1], [1, 1], [2, -1]]
    MFixed:       [1, 3, 7, 31, 4096, 8192]
    NHidden:      [128, 256, 384, 512, 640, 4096, 8192]
    K:            [1, 32, 64, 96, 128, 256, 512, 1024, 4096, 31, 97, 127, 4093, 8192]
  Pipeline:
    MMultipliers: [1, 2, 4, 8, 16, 32]
    MFractions:   [[1, 4], [1, 2]]
    MOffsets:     [[-1, -1], [1, 1], [2, -1]]
    MFixed:       [1, 3, 7, 31, 127, 193, 317, 511, 769, 1009, 1537, 4097, 8191]
    NHidden:      [128, 256, 384, 512, 768, 1024]
    K:            [64, 256, 4096]

LibraryLogic:
  ScheduleName: "partialrms_k1"
  DeviceNames: ["Device 74a1", "Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
